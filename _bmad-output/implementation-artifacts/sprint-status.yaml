# Story feature-fp-3-1b moved to review: 2026-05-31 (BMAD dev-story complete — Mission-side per-Face tier commission, sibling of FP-3.1a. MissionPricing VO reduced to producer-only (removed commissionFacesTotal/montantTotalFaces/montantParFace, const COMMISSION_RATE → PRODUCER_COMMISSION_RATE) so no caller can resurrect a uniform Face split; producer side stays flat 10 % and montant_total_producteur (the FedaPay charge) is byte-identical. MissionPaymentService injects FaceEntitlementService + eager-loads face.activeSubscription (no N+1); prepareSelectionForPayment resolves each selected Face's capabilities(face)->commissionRate (Découverte 15 % / Starter-Pro 10 % / Élite 5 %), computes her montant_face_recoit = budgetParFace − round(budgetParFace × rate), and persists commission_faces_total / montant_total_faces as the SUM of per-Face values. Invariant Σ montant_face_recoit + commission_faces_total = sousTotal held. Forward-only — no migration, no retroactive recompute. RED proved first via new MissionTierCommissionTest (per-Face mix / sum-not-flat / all-Découverte). T8 caught a real regression: the two partialMock(MissionPaymentService) FedaPay-failure tests flipped 422→500 because Laravel's partialMock bypasses the ctor, leaving the new readonly FaceEntitlementService uninitialized when the real prepareSelectionForPayment touches it (Error thrown outside the orchestration try/catch → escapes the controller's MissionPaymentInitiationException catch). Fixed with a partialMockPaymentServiceWithRealDeps() helper that builds the mock with real ctor args so construction runs — stale-test-double artifact, not a prod bug, ctor-injection design (matching BookingService) preserved. Files: 2 prod (MissionPricing.php, MissionPaymentService.php) + 4 tests (MissionPricingTest new, MissionTierCommissionTest new, MissionPaymentInitiationTest + MissionPaymentStatusTest helpers rewired). Full tests/Feature/Mission + tests/Feature/Booking + tests/Unit/ValueObjects = 534 passed (2298 assertions); Booking/FP-3.1a untouched and green; php -l clean on all edited files. epic-feature-fp-3 already in-progress — no epic status change. Changes uncommitted on feat/epic-feature-fp-3/1b branch.)
