ing videos: C, UGC videos: D, Errored: E.` Catch-block `Log::error` per Face. `self::SUCCESS` regardless of errored count (operator monitors via structured log). **No event dispatch, no mail, no notification, no audit row** — same lifecycle-cron invariant as FP-2.8/FP-2.8.1. **Presentation video (scalar on `faces`) explicitly OUT of scope** per epic AC #5 wording (Resolved Ambiguity #3). Hard-delete (no SoftDeletes on FacePhoto/FaceVideo). (3) MOD `backend/config/face_subscription_tiers.php` +1 line `'media_retention_days' => 90,` between `stale_pending_max_hours` (line 16) and `tiers` block (line 18). (4) MOD `backend/routes/console.php` +2 lines (alphabetical use-import insertion between FailStalePending and ReconcileWallet, scheduling entry appended as new line 36 with `->dailyAt('03:00')` mirroring `RemindShootingDayCommand::class)->dailyAt('08:00')` precedent at line 32). (5) MOD `backend/tests/Feature/Console/ScheduleWiringTest.php` +1 test `test_purge_expired_media_is_scheduled_daily_at_03_utc` asserting `'0 3 * * *'` (5→6 tests). (6) NEW `backend/tests/Unit/Services/FaceMediaRetentionServiceTest.php` 10 unit tests (anchor null / Expired-row / Cancelled-row pins Cancelled→cancelled_at NOT expires_at / multi-row MAX / ignore pending+active+failed / retentionUntil default 90 / retentionUntil config override / overQuota photos / overQuota acting+ugc / mediaPendingPurge boundary travelTo +2 days). (7) NEW `backend/tests/Feature/Commands/PurgeExpiredMediaCommandTest.php` 14 feature tests (empty universe / within-window Pro-30d / beyond-window Pro-91d photos / beyond-window Élite-100d acting+ugc / idempotent / re-subscribed-same-tier-no-purge / re-subscribed-higher-tier-no-purge / chained-downgrade-cancel-anchored / presentation-video-NEVER-purged / no-mail-no-event-no-notification / no-audit-row / Log::info x3 strict times(N) / transaction-throw-error-path-FacePhoto::deleting-one-shot-guard / multi-Face-mix). Total NET new tests : 10 + 14 + 1 = **25** (baseline 2508 → expected 2533). 43 ACs : service init (1), service methods (2-7), command init (8), command body (9-14), scheduler wiring (15), schedule test (16), unit test class init + 10 unit tests (17-27), feature test class init + 14 feature tests (28-42), strict non-scope (43). 11 resolved design decisions : (1) **computed-from-`face_subscriptions` retention shape NOT persisted `retention_until` column** — no migration, no backfill, naturally re-evaluates on re-subscription, matches FP-2 "config-driven no schema" philosophy ; FP-2.11.1 follow-up audit Section F + matrix retention cells consume the service API, hiding the persistence shape behind the service interface either way. (2) Cancelled→`cancelled_at` NOT `expires_at` for anchor (entitlement lost moment vs contractual end). (3) presentation video OUT of scope per epic AC #5 wording. (4) position-based over-quota identification (positions guaranteed contiguous 1..N by upload services + unique constraint). (5) no position re-sequencing post-purge (over-quota always = highest positions by construction). (6) cron cadence `->dailyAt('03:00')` (off-peak, daily sufficient for 90-day window, avoids hourly-cluster contention at minute 00). (7) `Log::shouldReceive(...)->times(N)` strict form over `Log::spy()`. (8) flat `App\Services\FaceMediaRetentionService` namespace (matches existing flat convention). (9) hardcoded disk path strings (PhotoAlbumService::STORAGE_PATH stays private, promoting would breach strict non-scope). (10) NO `plan` key in log payload (purge is media-shaped, not subscription-shaped). (11) split 10 unit + 14 feature tests (service is the contract FP-2.11.1 reuses ; pinning service surface independently). FP-2.14 leaves the FP-2.11.1 follow-up carve-out (`deferred-work.md:466-481`) explicitly out — that story will ship matrix retention cells + audit Section F + runbook Section 4.bis after FP-2.14 lands. Sibling FP-2.8/FP-2.8.1 patterns reused verbatim : `Storage::fake('public')` in setUp / multi-entity fixture with paired User row / factory state composition / `FacePhoto::deleting` one-shot `&$shouldThrow` guard mirroring FP-2.8's `FaceSubscription::updating` pattern / Mockery `shouldReceive` BEFORE artisan call / negative-grep gates on the command file (`FaceSubscriptionAudit`, `Mail::`, `Event::dispatch`, `Storage::disk('public')->put`, `presentation_video`, `is_featured`, `FaceVideoType::Presentation`). Strict non-scope upheld in the spec : all models / enums / migrations / services FaceEntitlementService+PhotoAlbumService+FaceVideoService+PresentationVideoService / sibling commands FP-2.8+FP-2.8.1+FP-2.9 / AuditFacePremiumReadinessCommand / FaceSubscriptionRegressionMatrixTest / events / listeners / mailables / controllers / resources / form requests / api routes / factories / frontend — all frozen byte-identical. Awaiting bmad-dev-story for implementation.)
