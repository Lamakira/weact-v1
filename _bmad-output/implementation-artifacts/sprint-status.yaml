# (new story feature-fp-2-8-1-stale-pending-cleanup-and-user-cancel added to backlog 2026-05-23 — backend hardening identifié pendant FP-2.7 v2 dev-story : sans cette story, une row pending_payment ne tombe JAMAIS automatiquement (le cron subscriptions:expire-faces n'opère que sur status=Active avec expires_at<=now() — FaceSubscription::expire-faces ne touche pas les pending), donc un user dont le paiement Fedapay est interrompu cross-session ou >24h reste bloqué par 409 PENDING_PAYMENT_EXISTS jusqu'à intervention admin. La mécanique sessionStorage "Continuer le paiement" de FP-2.7 v2 couvre le cas heureux (même session, <24h, URL Fedapay encore valide) mais pas les pathologiques. Story scope Option B (Recommandé), backend-only : (1) nouvelle cron hourly subscriptions:fail-stale-pending qui marque les rows pending_payment avec created_at < now()-48h comme Failed avec metadata stale_pending_at + auto_failed_by_cron + log, TTL via config('face_subscription_tiers.stale_pending_max_hours', 48) ; (2) nouvel endpoint POST /api/v1/face/subscription/cancel-pending (auth Face + email_verified) qui marque la propre row pending du user comme Failed via FaceSubscriptionPaymentService::cancelOwnPending(Face), lockForUpdate serialize contre Fedapay webhook race, throws FaceSubscriptionConflictException::noPendingPayment 404 si pas de pending, metadata cancelled_by_user_at + cancellation_source. Ferme partiellement D3 deferred-work.md (popup-blocked dangling row). Frontend "Annuler ce paiement" button defer à FP-2.13.1 ou FP-2.7 v2.1. Same family pattern : FP-2.8 (Active→Expired cron) et FP-2.8.1 (Pending→Failed cron) — sibling expiration crons. Non-scope défensif : pas de regenerate-checkout-url endpoint, pas de notification email sur auto-fail, pas de backfill rétroactif. ≥8 tests cron + ≥6 tests endpoint + zéro régression FP-2.5/2.7. See planning-artifacts/epics-face-premium-subscription-v2.md § FEATURE-FP-2.8.1.)
