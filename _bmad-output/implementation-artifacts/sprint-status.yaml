/1, acting 0/0/1/2, ugc 0/0/0/1 ; offers (all 4 tiers, ascending, full matrix) verified in SubscriptionStatusController::buildOffers. 3 resolved design decisions documented : (1) centralized helper + single reusable component, no per-section duplication ; (2) upsell shown on locked (quota-0) sections too — user-confirmed via AskUserQuestion, coexists with the child tier-locked banner as a plain inline nudge (no CTA button) ; (3) target = next tier that STRICTLY increases the media (not immediate adjacent) so the advertised benefit is always real — Acting@Découverte skips Starter→Pro, UGC→Élite, Présentation shows no upsell once capped at 1. Reuses TIER_PRESENTATION names + offers matrix (no new tier map, no static quota table). useSubscriptionStatus + child upload components consumed/left byte-identical (epic non-scope). Self-review : all references opened/verified, skeletons mentally parsed, augment-vs-create flagged per test. Awaiting bmad-dev-story for implementation on branch feat/epic-feature-fp-3/3-profile-quota-dynamic-upsell-copy.)

