# (story feature-fp-2-6 moved to done on 2026-05-22 — bmad-code-review 3-layer adversarial pass complete (Blind Hunter / Edge Case Hunter / Acceptance Auditor): 19 unique findings after dedup → 3 patched + 1 deferred + 15 dismissed. The 3 patches all on Public\FaceController::index — (1) appended a final `->orderBy('id','desc')` tiebreaker: the FP-2.6 four-key ORDER BY had no unique final key, causing non-deterministic pagination (a Face appearing on two adjacent pages while another is skipped — reproduced empirically by the Edge Case Hunter); (2) fail-loud config — new private `tierSortPriority()` helper throws `RuntimeException` on a missing/non-numeric `sort_priority` instead of `(int)`-coercing null to 0 and floating a misconfigured tier to the top of the public list, now consistent with `FaceEntitlementService::buildCapabilities()`; (3) `expires_at > NOW()` → `expires_at > ?` bound to `now()` so the tier-ordering subquery uses the Laravel application clock like `Face::activeSubscription`, making resolved design decision #3 literally true. Deferred (1): pre-existing per-Face N+1 in the public-list serialization (`PublicFaceResource` → `Face::averageRating` accessor, ~2 queries/Face) — AC #13's endpoint-wide "does not scale with N" not literally met, out of FP-2.6 ordering-only 4-file scope, recorded in deferred-work.md. 15 dismissed as blind-layer false positives (verified against the codebase) or by-design / story-acknowledged choices. Full backend suite 2431 passed / 11268 assertions, zero regressions; Pint + PHPStan level 5 clean on the patched file. Process note: a review sub-agent auto-wrote a partial 3-finding section into the story file + a deferred-work.md entry mid-review — the partial story section was superseded by this complete triage; the deferred-work.md N+1 entry was correct and kept.)
# (story feature-fp-2-6 moved to review on 2026-05-22 — FEATURE-FP-2.6 producer-facing search ordering by tier priority implemented via bmad-dev-story: 4 files — 2 modified production (Public\FaceController::index — the FP-1.6 single orderByRaw CASE bucket-0 predicate `is_featured = 1 OR EXISTS(active sub)` replaced by a 4-key ORDER BY: key 1 a config-driven correlated scalar subquery mapping the representative active subscription's plan to config sort_priority Élite 1 / Pro 2 / Starter 3 with COALESCE to free 4, the subquery picking the same representative row as Face::activeSubscription via expires_at DESC, id DESC LIMIT 1 ; key 2 is_featured DESC ; key 3 the FP-1.6 profile-completeness CASE ; key 4 created_at DESC — priority integers built as bindings from config/face_subscription_tiers.php with zero SQL literals, FaceSubscriptionPlan import added ; FaceResource — the admin-only is_featured_by_subscription boolean replaced by a subscription_tier string from $capabilities->tier->value, same $viewer===admin gate) + 2 test files (PublicFacesListTest +14 new tier-ordering tests + the test_public_response_omits augmentation, AdminFaceCrudTest 6 is_featured_by_subscription tests rewritten to subscription_tier + 2 new starter/elite tests) ; 2 test-layer deviations from the story spec with production logic unchanged — (1) test_orders_faces_by_featured_then_profile_completeness_then_creation_date updated via a 2-line expected-order swap: the 4-key ORDER BY applies profile-completeness within the featured group, which the FP-1.6 single CASE did not, so oldFeatured (photo+tarif) now outranks the newer newFeatured (photo only) per AC #12 ; (2) the no-N+1 test rewritten as test_tier_priority_ordering_adds_no_per_row_queries — asserts the query count is identical with vs without active subscriptions, proving the tier-ordering subquery is O(1) queries ; a pre-existing per-Face N+1 in the public faces list serialization was surfaced for the team (unrelated to FP-2.6, out of scope) ; full backend suite 2431 passed / 11268 assertions, zero regressions (FP-2.5 baseline 2415 + exactly 16 new tests) ; Pint clean on all 4 touched files ; PHPStan level 5 — 0 errors on the 2 touched app/ files ; strict non-scope upheld — no frontend, no FaceEntitlementService change (the isFeaturedBySubscription shim left for the final-consumer story), no migration/schema/config/route, no Admin/Producer controller change, no public tier field on PublicFaceResource. Awaiting bmad-code-review.)
