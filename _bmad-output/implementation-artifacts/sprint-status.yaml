ky Active no-downgrade / dates remain null); (9) 6 webhook tests in new SubscriptionPaymentWebhookTest covering approved routing + activation / approved replay no-op / approved with non-integer amount (string-float/NaN/negative/null/missing) → config fallback + log warning / declined→failed / canceled→failed / cross-domain isolation (MissionPayment vs FaceSubscription provider_reference disambiguation); resolves FP-1.1 defers #255 (mass-assignment via explicit fillable arrays no `$request->all()`), #256 (paid_amount cast via extractPaidAmount), #257 (metadata always array<string,mixed>), #261 (no partial unique index — mitigated by lockForUpdate + unique provider_reference + cache lock); strict non-scope upheld — no diff on face_subscriptions migration/FaceSubscription model/FaceSubscriptionStatus or Plan enums/FaceSubscriptionFactory/FaceEntitlementService/FaceSubscriptionAdminService/FaceSubscriptionAudit*/SubscriptionStatusController/any other controller-Resource-route/bootstrap.app.php/config-face_premium/env.example/frontend/notifications/email/queue jobs/FinancialEvent rows (deliberately deferred to FP-1.10 to avoid drift on RecordsFinancialEvent trait's booking-centric shape)/featured ordering FP-1.6/expiration cron FP-1.8/admin offline payment metadata FP-1.4 defer #294 (out of scope — this is online-only)/self-healing polling on /subscription-status (low-stakes domain)/DB partial unique index hardening)
