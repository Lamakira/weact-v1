ble test :70-79 unchanged). Key reuse (no reinvention) : /pricing (PricingView.vue) is already the auth-aware comparison + payment surface — isFace branch :718, payment via useSubscriptionPayment+TierChangeModal :287-417, email-verified gate :352 + note :498-504, and a ?plan= deep-link :455-488 (accepted starter/pro/elite :463) that auto-opens the payment modal iff verified — so routing the CTA there starts payment AND respects email verification with ZERO new gating code. 5 resolved design decisions documented : (1) standalone /bienvenue route vs child-of-/face — standalone, to avoid FaceLayout sidebar+banners chrome on an onboarding screen ; (2) « Choisir un plan » delegates to /pricing?plan=X, no payment re-implementation (money-adjacent regression risk, same rationale FP-3.2 used vs refactoring billing) ; (3) preserve ?redirect= bounce-back, change ONLY the default — a Face sent to register from a protected deep-link returns there, not hijacked to upsell (also prevents the loop) ; (4) NO mount-time redirect / no « already-seen » flag — the upsell route is pushed ONLY from handleSuccess, login lands on dashboard, direct visits just render → no loop without side-effects ; (5) present tiers via TIER_PRESENTATION + delegate prices/offers to /pricing (avoids a 3rd copy of the hardcoded price strings + a useSubscriptionStatus fetch). Non-scope : Producer flow (RegisterProducerPage :30-37 still → /producer/dashboard), backend registration, payment overlay, PricingView edits, useAuth/useSubscriptionStatus changes, email-verification gating changes, FaceRegistrationForm.spec (its vestigial /face/dashboard route :22 asserts no page-level redirect). Self-review : all references opened/verified against the current codebase, skeletons mentally parsed (only Crown imported from lucide, vi imported from vitest), augment-vs-create flagged per test. Awaiting bmad-dev-story for implementation on branch feat/epic-feature-fp-3/3-profile-quota-dynamic-upsell-copy.)
